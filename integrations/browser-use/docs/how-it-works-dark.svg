<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="title desc"><title id="title">How CookieGuard for Browser Use works</title><desc id="desc">Animated overview of CookieGuard for Browser Use. 1. Your test starts CookieGuard, then the Browser Use agent. 2. The agent logs in. Its model sees the page, never cookie values. 3. The app responds with Set-Cookie: session_id (here: no HttpOnly). 4. CookieGuard reads the same browser over its own CDP connection. 5. The local engine applies the policy. Cookie values stay on your machine. 6. Your test enforces the result. The agent cannot override it.</desc><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6EDF3}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.mu{fill:#9198A1}.edge{stroke:#3D444D;stroke-width:1.5;fill:none}.dash{stroke-dasharray:4 4}.comet,.glow,.cap{opacity:0}.badge circle{transition:none}@keyframes march{to{stroke-dashoffset:-16}}@keyframes k10{0%,13.33%{stroke-dashoffset:14;opacity:0}13.42%{opacity:1}18.89%{stroke-dashoffset:-48;opacity:1}18.97%,100%{stroke-dashoffset:-48;opacity:0}}@keyframes k11{0%,18.89%{stroke-dashoffset:14;opacity:0}18.97%{opacity:1}24.44%{stroke-dashoffset:-48;opacity:1}24.53%,100%{stroke-dashoffset:-48;opacity:0}}@keyframes k12{0%,24.44%{stroke-dashoffset:14;opacity:0}24.53%{opacity:1}30.00%{stroke-dashoffset:-40;opacity:1}30.08%,100%{stroke-dashoffset:-40;opacity:0}}@keyframes k20{0%,30.00%{stroke-dashoffset:14;opacity:0}30.08%{opacity:1}43.33%{stroke-dashoffset:-40;opacity:1}43.42%,100%{stroke-dashoffset:-40;opacity:0}}@keyframes k30{0%,43.33%{stroke-dashoffset:14;opacity:0}43.42%{opacity:1}56.67%{stroke-dashoffset:-94;opacity:1}56.75%,100%{stroke-dashoffset:-94;opacity:0}}@keyframes k40{0%,56.67%{stroke-dashoffset:14;opacity:0}56.75%{opacity:1}70.00%{stroke-dashoffset:-48;opacity:1}70.08%,100%{stroke-dashoffset:-48;opacity:0}}@keyframes k50{0%,70.00%{stroke-dashoffset:14;opacity:0}70.08%{opacity:1}93.33%{stroke-dashoffset:-48;opacity:1}93.42%,100%{stroke-dashoffset:-48;opacity:0}}@keyframes gmodel0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gagent0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gchromium0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gapp0{0%,29.92%{opacity:0}30.00%,43.33%{opacity:1}43.42%,100%{opacity:0}}@keyframes gtest0{0%,0.00%{opacity:0}0.00%,13.33%{opacity:1}13.42%,100%{opacity:0}}@keyframes gtest1{0%,69.92%{opacity:0}70.00%,93.33%{opacity:1}93.42%,100%{opacity:0}}@keyframes gengine0{0%,56.58%{opacity:0}56.67%,70.00%{opacity:1}70.08%,100%{opacity:0}}@keyframes gobserver0{0%,43.25%{opacity:0}43.33%,56.67%{opacity:1}56.75%,100%{opacity:0}}@keyframes b1{0%,0.00%{r:9}1.67%{r:12}4.17%,13.33%{r:10}15.00%,100%{r:9}}@keyframes b2{0%,13.33%{r:9}15.00%{r:12}17.50%,30.00%{r:10}31.67%,100%{r:9}}@keyframes b3{0%,30.00%{r:9}31.67%{r:12}34.17%,43.33%{r:10}45.00%,100%{r:9}}@keyframes b4{0%,43.33%{r:9}45.00%{r:12}47.50%,56.67%{r:10}58.33%,100%{r:9}}@keyframes b5{0%,56.67%{r:9}58.33%{r:12}60.83%,70.00%{r:10}71.67%,100%{r:9}}@keyframes b6{0%,70.00%{r:9}71.67%{r:12}74.17%,93.33%{r:10}95.00%,100%{r:9}}@keyframes chipset{0%,31.67%{opacity:0}35.00%,96.67%{opacity:1}99.17%,100%{opacity:0}}@keyframes chipverdict{0%,74.17%{opacity:0}77.50%,96.67%{opacity:1}99.17%,100%{opacity:0}}@keyframes c0{0%,0.00%{opacity:0}0.00%,13.33%{opacity:1}13.42%,100%{opacity:0}}@keyframes c1{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes c2{0%,29.92%{opacity:0}30.00%,43.33%{opacity:1}43.42%,100%{opacity:0}}@keyframes c3{0%,43.25%{opacity:0}43.33%,56.67%{opacity:1}56.75%,100%{opacity:0}}@keyframes c4{0%,56.58%{opacity:0}56.67%,70.00%{opacity:1}70.08%,100%{opacity:0}}@keyframes c5{0%,69.92%{opacity:0}70.00%,97.50%{opacity:1}97.58%,100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.comet,.glow,.cap,.badge circle{animation-duration:12.0s;animation-timing-function:linear;animation-iteration-count:infinite}.flow{animation:march 1s linear infinite}.chip-set{animation:chipset 12.0s linear infinite}.chip-verdict{animation:chipverdict 12.0s linear infinite}.static-cap{opacity:0}}</style><rect width="760" height="340" rx="12" fill="#0D1117"/><path class="edge" d="M164,71 L212,71"/><polygon points="212,71 206,67 206,75" fill="#3D444D"/><path class="edge" d="M360,71 L408,71"/><polygon points="408,71 402,67 402,75" fill="#3D444D"/><path class="edge" d="M556,71 L596,71"/><polygon points="596,71 590,67 590,75" fill="#3D444D"/><polygon points="556,71 562,75 562,67" fill="#3D444D"/><path class="edge" d="M482,102 L482,196"/><polygon points="482,196 478,190 486,190" fill="#3D444D"/><path class="edge" d="M408,227 L360,227"/><polygon points="360,227 366,231 366,223" fill="#3D444D"/><path class="edge" d="M212,227 L164,227"/><polygon points="164,227 170,231 170,223" fill="#3D444D"/><path class="edge dash flow" d="M286,102 L286,196"/><text class="t mu" x="294" y="147" font-size="11">optional read-only tool</text><text class="t mu m" x="294" y="161" font-size="11">cookieguard_audit</text><text class="t mu" x="498" y="153" font-size="11">separate CDP:</text><text class="t mu" x="498" y="167" font-size="11">Set-Cookie + cookie store</text><path class="comet" d="M164,71 L212,71" stroke="#4493F8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 88" style="animation-name:k10"/><path class="comet" d="M360,71 L408,71" stroke="#4493F8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 88" style="animation-name:k11"/><path class="comet" d="M556,71 L596,71" stroke="#4493F8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 80" style="animation-name:k12"/><path class="comet" d="M596,71 L556,71" stroke="#D29922" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 80" style="animation-name:k20"/><path class="comet" d="M482,102 L482,196" stroke="#AB7DF8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 134" style="animation-name:k30"/><path class="comet" d="M408,227 L360,227" stroke="#AB7DF8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 88" style="animation-name:k40"/><path class="comet" d="M212,227 L164,227" stroke="#AB7DF8" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 88" style="animation-name:k50"/><rect x="16" y="40" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="16" y="40" width="4" height="62" rx="2" fill="#4493F8"/><text class="t" x="32" y="66" font-size="13" font-weight="600">AI model</text><text class="t mu" x="32" y="84" font-size="11">any provider</text><rect class="glow" x="13" y="37" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gmodel0"/><rect x="212" y="40" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="212" y="40" width="4" height="62" rx="2" fill="#4493F8"/><text class="t" x="228" y="66" font-size="13" font-weight="600">Browser Use agent</text><text class="t mu" x="228" y="84" font-size="11">logs in, clicks, types</text><rect class="glow" x="209" y="37" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gagent0"/><rect x="408" y="40" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="408" y="40" width="4" height="62" rx="2" fill="#9198A1"/><text class="t" x="424" y="66" font-size="13" font-weight="600">Chromium</text><text class="t mu" x="424" y="84" font-size="11">one browser session</text><rect class="glow" x="405" y="37" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gchromium0"/><rect x="596" y="40" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="596" y="40" width="4" height="62" rx="2" fill="#3FB950"/><text class="t" x="612" y="66" font-size="13" font-weight="600">Your app</text><text class="t mu" x="612" y="84" font-size="11">authorized test target</text><rect class="glow" x="593" y="37" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gapp0"/><rect x="16" y="196" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="16" y="196" width="4" height="62" rx="2" fill="#AB7DF8"/><text class="t" x="32" y="222" font-size="13" font-weight="600">Your test code</text><text class="t mu" x="32" y="240" font-size="11">start → run → finish</text><rect class="glow" x="13" y="193" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gtest0"/><rect class="glow" x="13" y="193" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gtest1"/><rect x="212" y="196" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="212" y="196" width="4" height="62" rx="2" fill="#AB7DF8"/><text class="t" x="228" y="222" font-size="13" font-weight="600">CookieGuard engine</text><text class="t mu" x="228" y="240" font-size="11">local · CG001–CG009</text><rect class="glow" x="209" y="193" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gengine0"/><rect x="408" y="196" width="148" height="62" rx="10" fill="#161B22" stroke="#30363D"/><rect x="408" y="196" width="4" height="62" rx="2" fill="#AB7DF8"/><text class="t" x="424" y="222" font-size="13" font-weight="600">CookieGuard observer</text><text class="t mu" x="424" y="240" font-size="11">its own CDP connection</text><rect class="glow" x="405" y="193" width="154" height="68" rx="12" fill="none" stroke="#AB7DF8" stroke-width="2.5" style="animation-name:gobserver0"/><rect x="596" y="196" width="148" height="62" rx="10" fill="none" stroke="#30363D" stroke-dasharray="4 3"/><text class="t mu" x="608" y="214" font-size="11">Cookie values: local</text><text class="t mu" x="608" y="229" font-size="11">engine only. Never the</text><text class="t mu" x="608" y="244" font-size="11">model, logs, or reports.</text><g class="badge"><circle cx="16" cy="196" r="9" fill="#AB7DF8" style="animation-name:b1"/><text x="16" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1</text></g><g class="badge"><circle cx="188" cy="54" r="9" fill="#AB7DF8" style="animation-name:b2"/><text x="188" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">2</text></g><g class="badge"><circle cx="576" cy="54" r="9" fill="#AB7DF8" style="animation-name:b3"/><text x="576" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">3</text></g><g class="badge"><circle cx="482" cy="149" r="9" fill="#AB7DF8" style="animation-name:b4"/><text x="482" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4</text></g><g class="badge"><circle cx="384" cy="211" r="9" fill="#AB7DF8" style="animation-name:b5"/><text x="384" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">5</text></g><g class="badge"><circle cx="188" cy="211" r="9" fill="#AB7DF8" style="animation-name:b6"/><text x="188" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#0D1117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">6</text></g><g class="chip-set"><rect x="558" y="114" width="191" height="38" rx="6" fill="#2E2A1C" stroke="#D29922"/><text class="t m" x="567" y="130" font-size="11" style="fill:#D29922">Set-Cookie: session_id=…</text><text class="t m" x="567" y="145" font-size="11" style="fill:#D29922">Secure; SameSite=Lax</text></g><g class="chip-verdict"><rect x="16" y="270" width="301" height="24" rx="6" fill="#2D1517" stroke="#F85149"/><text class="t" x="26" y="286" font-size="12" font-weight="700" style="fill:#F85149">FAIL · CG001 Missing HttpOnly · exit 1</text></g><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c0"><tspan x="380.0" dy="0">1. Your test starts CookieGuard, then the Browser Use agent.</tspan></text><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c1"><tspan x="380.0" dy="0">2. The agent logs in. Its model sees the page, never cookie values.</tspan></text><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c2"><tspan x="380.0" dy="0">3. The app responds with Set-Cookie: session_id (here: no HttpOnly).</tspan></text><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c3"><tspan x="380.0" dy="0">4. CookieGuard reads the same browser over its own CDP connection.</tspan></text><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c4"><tspan x="380.0" dy="0">5. The local engine applies the policy. Cookie values stay on your machine.</tspan></text><text class="t cap" x="380.0" y="312" text-anchor="middle" font-size="13" style="animation-name:c5"><tspan x="380.0" dy="0">6. Your test enforces the result. The agent cannot override it.</tspan></text><text class="t mu static-cap" x="380.0" y="312" text-anchor="middle" font-size="12"><tspan x="380.0" dy="0">Test starts CookieGuard → agent logs in → app sets the cookie → CookieGuard observes → local engine decides → test</tspan><tspan x="380.0" dy="16">enforces.</tspan></text></svg>

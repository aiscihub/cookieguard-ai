<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="title desc"><title id="title">CookieGuard policy</title><desc id="desc">CookieGuard policy: CookieGuardAudit options decide which findings fail. High-severity rules CG001, CG002, CG006 and CG007 fail by default; medium rules CG003 and CG005 fail when fail_on is medium; CG004 needs require_host_only; CG008 and CG009 are review only. Results: FAIL, INCOMPLETE, or PASS.</desc><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1F2328}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.mu{fill:#59636E}.b,.cap{opacity:0}@keyframes showA{0%,48%{opacity:1}52%,98%{opacity:0}100%{opacity:1}}@keyframes showB{0%,48%{opacity:0}52%,98%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.a{animation:showA 10.0s linear infinite}.b{animation:showB 10.0s linear infinite}.ca{animation:showA 10.0s linear infinite}.cb{animation:showB 10.0s linear infinite}.static{opacity:0}}</style><rect width="760" height="640" rx="12" fill="#FFFFFF"/><text class="t" x="16" y="30" font-size="15" font-weight="600">Your policy decides which findings fail the run</text><rect x="16" y="50" width="266" height="231" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="16" y="50" width="4" height="231" rx="2" fill="#8250DF"/><text class="t" x="32" y="74" font-size="13" font-weight="600">1 · Your policy</text><text class="t m" x="32" y="100" font-size="11">CookieGuardAudit(</text><text class="t m" x="45" y="119" font-size="11">auth_cookies=[&#x27;session_id&#x27;],</text><text class="t m" x="45" y="138" font-size="11">fail_on=</text><text class="t m a" x="98" y="138" font-size="11" font-weight="700" style="fill:#CF222E">&#x27;high&#x27;,</text><text class="t m b" x="98" y="138" font-size="11" font-weight="700" style="fill:#CF222E">&#x27;medium&#x27;,</text><text class="t m" x="45" y="157" font-size="11">allowed_same_site=(&#x27;lax&#x27;,&#x27;strict&#x27;),</text><text class="t m" x="45" y="176" font-size="11">require_host_only=False,</text><text class="t m" x="45" y="195" font-size="11">max_lifetime_days=30,</text><text class="t m" x="32" y="214" font-size="11">)</text><text class="t mu" x="32" y="241" font-size="11">Only cookies named in auth_cookies can</text><text class="t mu" x="32" y="256" font-size="11">be confirmed. Others are review items</text><text class="t mu" x="32" y="271" font-size="11">(CG008).</text><text class="t" x="298" y="64" font-size="13" font-weight="600">2 · Rules by severity</text><text class="t mu" x="298" y="90" font-size="10" letter-spacing="0.6">HIGH</text><rect x="298" y="98" width="282" height="26" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="298" y="98" width="282" height="26" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="115" font-size="11" font-weight="700">CG001</text><text class="t" x="354" y="115" font-size="12">Missing HttpOnly</text><text class="t" x="570" y="115" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="298" y="130" width="282" height="26" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="298" y="130" width="282" height="26" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="147" font-size="11" font-weight="700">CG002</text><text class="t" x="354" y="147" font-size="12">Missing Secure</text><text class="t" x="570" y="147" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="298" y="162" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="298" y="162" width="282" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="179" font-size="11" font-weight="700">CG006</text><text class="t" x="354" y="179" font-size="12">Invalid cookie prefix</text><text class="t mu m" x="354" y="194" font-size="10">__Host- / __Secure-</text><text class="t" x="570" y="179" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="298" y="208" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="298" y="208" width="282" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="225" font-size="11" font-weight="700">CG007</text><text class="t" x="354" y="225" font-size="12">Protection regressed</text><text class="t mu m" x="354" y="240" font-size="10">finish(baseline=…)</text><text class="t" x="570" y="225" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><text class="t mu" x="298" y="286" font-size="10" letter-spacing="0.6">MEDIUM</text><rect x="298" y="294" width="282" height="54" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect class="b" x="298" y="294" width="282" height="54" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="311" font-size="11" font-weight="700">CG003</text><text class="t" x="354" y="311" font-size="12">SameSite outside policy</text><text class="t mu m" x="354" y="326" font-size="10">allowed_same_site</text><text class="t mu m" x="354" y="339" font-size="10">require_explicit_same_site</text><text class="t mu a" x="570" y="311" text-anchor="end" font-size="10">reported</text><text class="t b" x="570" y="311" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="298" y="354" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="308" y="371" font-size="11" font-weight="700">CG004</text><text class="t" x="354" y="371" font-size="12">Domain sharing</text><text class="t mu m" x="354" y="386" font-size="10">review unless require_host_only=True</text><text class="t mu" x="570" y="371" text-anchor="end" font-size="10">reported</text><rect x="298" y="400" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect class="b" x="298" y="400" width="282" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="308" y="417" font-size="11" font-weight="700">CG005</text><text class="t" x="354" y="417" font-size="12">Lifetime over the limit</text><text class="t mu m" x="354" y="432" font-size="10">max_lifetime_days</text><text class="t mu a" x="570" y="417" text-anchor="end" font-size="10">reported</text><text class="t b" x="570" y="417" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><text class="t mu" x="298" y="478" font-size="10" letter-spacing="0.6">REVIEW ONLY · NEVER FAILS</text><rect x="298" y="486" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="308" y="503" font-size="11" font-weight="700">CG008</text><text class="t" x="354" y="503" font-size="12">Role not confirmed</text><text class="t mu m" x="354" y="518" font-size="10">cookie not in auth_cookies</text><text class="t mu" x="570" y="503" text-anchor="end" font-size="10">reported</text><rect x="298" y="532" width="282" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="308" y="549" font-size="11" font-weight="700">CG009</text><text class="t" x="354" y="549" font-size="12">Evidence needs review</text><text class="t mu m" x="354" y="564" font-size="10">e.g. SameSite declaration unknown</text><text class="t mu" x="570" y="549" text-anchor="end" font-size="10">reported</text><g class="a"><line x1="292" y1="260" x2="586" y2="260" stroke="#CF222E" stroke-width="2" stroke-dasharray="6 4"/><rect x="452" y="251" width="122" height="18" rx="9" fill="#FFFFFF" stroke="#CF222E"/><text class="t m" x="513" y="264" text-anchor="middle" font-size="10" font-weight="700" style="fill:#CF222E">fail_on='high' ▲</text></g><g class="b"><line x1="292" y1="452" x2="586" y2="452" stroke="#CF222E" stroke-width="2" stroke-dasharray="6 4"/><rect x="452" y="443" width="122" height="18" rx="9" fill="#FFFFFF" stroke="#CF222E"/><text class="t m" x="513" y="456" text-anchor="middle" font-size="10" font-weight="700" style="fill:#CF222E">fail_on='medium' ▲</text></g><text class="t" x="596" y="64" font-size="13" font-weight="600">3 · Result</text><rect x="596" y="80" width="148" height="56" rx="8" fill="#F6F8FA" stroke="#CF222E"/><text class="t" x="606" y="98" font-size="11" font-weight="700" style="fill:#CF222E">FAIL · exit 1</text><text class="t mu" x="606" y="114" font-size="10.5">A confirmed finding</text><text class="t mu" x="606" y="128" font-size="10.5">at or above fail_on.</text><rect x="596" y="144" width="148" height="84" rx="8" fill="#F6F8FA" stroke="#9A6700"/><text class="t" x="606" y="162" font-size="11" font-weight="700" style="fill:#9A6700">INCOMPLETE · exit 2</text><text class="t mu" x="606" y="178" font-size="10.5">An expected cookie is</text><text class="t mu" x="606" y="192" font-size="10.5">missing, or evidence</text><text class="t mu" x="606" y="206" font-size="10.5">is unreliable.</text><text class="t mu" x="606" y="220" font-size="10.5">Overrides FAIL.</text><rect x="596" y="236" width="148" height="56" rx="8" fill="#F6F8FA" stroke="#1A7F37"/><text class="t" x="606" y="254" font-size="11" font-weight="700" style="fill:#1A7F37">PASS · exit 0</text><text class="t mu" x="606" y="270" font-size="10.5">Otherwise. Review</text><text class="t mu" x="606" y="284" font-size="10.5">items may remain.</text><text class="t cap ca" x="380.0" y="618" text-anchor="middle" font-size="12.5"><tspan x="380.0" dy="0">fail_on=&#x27;high&#x27; (default): only high-severity findings fail the run.</tspan></text><text class="t cap cb" x="380.0" y="618" text-anchor="middle" font-size="12.5"><tspan x="380.0" dy="0">fail_on=&#x27;medium&#x27;: SameSite and lifetime findings fail too.</tspan></text><text class="t mu static" x="380.0" y="618" text-anchor="middle" font-size="12"><tspan x="380.0" dy="0">With fail_on=&#x27;medium&#x27;, CG003 and CG005 fail too. CG004 fails only with require_host_only=True.</tspan></text></svg>

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cookieguard-browser-use"
version = "0.1.0b1"
description = "CookieGuard authentication-cookie policy checks for Browser Use agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "aiscihub" }]
keywords = ["browser-use", "cookies", "security", "authentication", "ai-agents", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
# Tested with browser-use 0.13.14 / cdp-use 1.4.5. Node.js 24+ is required at
# runtime for the vendored CookieGuard engine; it is not a Python dependency.
dependencies = [
  "browser-use>=0.13.14,<0.14",
  "cdp-use>=1.4.5,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.urls]
Homepage = "https://github.com/aiscihub/cookieguard-ai/tree/main/integrations/browser-use"
Repository = "https://github.com/aiscihub/cookieguard-ai"
Issues = "https://github.com/aiscihub/cookieguard-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cookieguard_browser_use"]
# Generated by scripts/vendor_engine.mjs and ignored by git, so list explicitly.
artifacts = [
  "src/cookieguard_browser_use/_node/node_modules/**",
  "src/cookieguard_browser_use/_node/manifest.json",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "hatch_build.py", "README.md", "LICENSE", "pyproject.toml"]
artifacts = [
  "src/cookieguard_browser_use/_node/node_modules/**",
  "src/cookieguard_browser_use/_node/manifest.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: launches a real local Chromium through Browser Use",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cookieguard"
version = "0.1.0"
description = "CookieGuard authentication-cookie security checks for AI browser agents (installs cookieguard-browser-use)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "aiscihub" }]
keywords = ["cookieguard", "browser-use", "ai-agents", "session-cookie", "cookies", "authentication", "security", "security-testing", "httponly", "samesite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# The real implementation. Keep this range in step with cookieguard-browser-use releases.
dependencies = ["cookieguard-browser-use>=0.1.0,<0.2"]

[project.urls]
Homepage = "https://github.com/aiscihub/cookieguard-ai"
Documentation = "https://github.com/aiscihub/cookieguard-ai/tree/main/integrations/browser-use"
Repository = "https://github.com/aiscihub/cookieguard-ai"
Issues = "https://github.com/aiscihub/cookieguard-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cookieguard"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

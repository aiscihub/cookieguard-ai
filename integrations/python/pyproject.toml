[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "cookieguard"
version = "0.4.0"
description = "CookieGuard authentication-cookie policy checks for AI browser agents, starting with Browser Use"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "aiscihub" }]
keywords = ["cookieguard", "browser-use", "ai-agents", "browser-automation", "session-cookie", "cookies", "authentication", "security", "security-testing", "httponly", "samesite", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Tested with browser-use 0.13.14 / cdp-use 1.4.5. Node.js 24+ is required at
# runtime for the vendored CookieGuard engine; it is not a Python dependency.
dependencies = [
  "browser-use>=0.13.14,<0.14",
  "cdp-use>=1.4.5,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.urls]
Homepage = "https://github.com/aiscihub/cookieguard-ai/tree/main/integrations/python"
Repository = "https://github.com/aiscihub/cookieguard-ai"
Documentation = "https://github.com/aiscihub/cookieguard-ai/tree/main/integrations/python/docs"
Changelog = "https://github.com/aiscihub/cookieguard-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/aiscihub/cookieguard-ai/issues"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

# Only the package description gets absolute links. Keep GitHub's README relative.
# Update these release-tag pins together with the package version.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?P<prefix>(?:src|srcset)="|!\[[^\]]*\]\()(?P<path>docs/[^"()\s]+\.(?:svg|gif))'''
replacement = '\g<prefix>https://raw.githubusercontent.com/aiscihub/cookieguard-ai/cookieguard-v0.4.0/integrations/python/\g<path>'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?P<prefix>\]\()(?P<path>docs/[^)\s]+\.md(?:#[^)\s]*)?)'''
replacement = '\g<prefix>https://github.com/aiscihub/cookieguard-ai/blob/cookieguard-v0.4.0/integrations/python/\g<path>'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?P<prefix>\]\()\.\./\.\./(?P<path>README\.md(?:#[^)\s]*)?)'''
replacement = '\g<prefix>https://github.com/aiscihub/cookieguard-ai/blob/cookieguard-v0.4.0/\g<path>'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(?P<prefix>\]\()VALIDATION\.md(?P<anchor>#[^)\s]*)?'''
replacement = '\g<prefix>https://github.com/aiscihub/cookieguard-ai/blob/cookieguard-v0.4.0/integrations/python/VALIDATION.md\g<anchor>'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'https://github\.com/aiscihub/cookieguard-ai/blob/main/docs/USAGE_METRICS\.md'
replacement = 'https://github.com/aiscihub/cookieguard-ai/blob/cookieguard-v0.4.0/docs/USAGE_METRICS.md'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = ', not yet on PyPI\.'
replacement = '.'

[tool.hatch.build.targets.wheel]
packages = ["src/cookieguard"]
# Generated by scripts/vendor_engine.mjs and ignored by git, so list explicitly.
artifacts = [
  "src/cookieguard/_node/node_modules/**",
  "src/cookieguard/_node/manifest.json",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "hatch_build.py", "README.md", "LICENSE", "pyproject.toml"]
artifacts = [
  "src/cookieguard/_node/node_modules/**",
  "src/cookieguard/_node/manifest.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: launches a real local Chromium through Browser Use",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" width="380" height="560" role="img" aria-labelledby="title desc"><title id="title">How CookieGuard for Browser Use works</title><desc id="desc">Animated overview of CookieGuard for Browser Use. 1. Your test starts CookieGuard, then the Browser Use agent. 2. The agent logs in. Its model sees the page, never cookie values. 3. The app responds with Set-Cookie: session_id (here: no HttpOnly). 4. CookieGuard reads the same browser over its own CDP connection. 5. The local engine applies the policy. Cookie values stay on your machine. 6. Your test enforces the result. The agent cannot override it.</desc><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1F2328}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.mu{fill:#59636E}.edge{stroke:#AFB8C1;stroke-width:1.5;fill:none}.dash{stroke-dasharray:4 4}.comet,.glow,.cap{opacity:0}.badge circle{transition:none}@keyframes march{to{stroke-dashoffset:-16}}@keyframes k10{0%,13.33%{stroke-dashoffset:14;opacity:0}13.42%{opacity:1}18.89%{stroke-dashoffset:-32;opacity:1}18.97%,100%{stroke-dashoffset:-32;opacity:0}}@keyframes k11{0%,18.89%{stroke-dashoffset:14;opacity:0}18.97%{opacity:1}24.44%{stroke-dashoffset:-52;opacity:1}24.53%,100%{stroke-dashoffset:-52;opacity:0}}@keyframes k12{0%,24.44%{stroke-dashoffset:14;opacity:0}24.53%{opacity:1}30.00%{stroke-dashoffset:-32;opacity:1}30.08%,100%{stroke-dashoffset:-32;opacity:0}}@keyframes k20{0%,30.00%{stroke-dashoffset:14;opacity:0}30.08%{opacity:1}43.33%{stroke-dashoffset:-32;opacity:1}43.42%,100%{stroke-dashoffset:-32;opacity:0}}@keyframes k30{0%,43.33%{stroke-dashoffset:14;opacity:0}43.42%{opacity:1}56.67%{stroke-dashoffset:-52;opacity:1}56.75%,100%{stroke-dashoffset:-52;opacity:0}}@keyframes k40{0%,56.67%{stroke-dashoffset:14;opacity:0}56.75%{opacity:1}70.00%{stroke-dashoffset:-52;opacity:1}70.08%,100%{stroke-dashoffset:-52;opacity:0}}@keyframes k50{0%,70.00%{stroke-dashoffset:14;opacity:0}70.08%{opacity:1}93.33%{stroke-dashoffset:-32;opacity:1}93.42%,100%{stroke-dashoffset:-32;opacity:0}}@keyframes gmodel0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gagent0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gapp0{0%,29.92%{opacity:0}30.00%,43.33%{opacity:1}43.42%,100%{opacity:0}}@keyframes gchromium0{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes gobserver0{0%,43.25%{opacity:0}43.33%,56.67%{opacity:1}56.75%,100%{opacity:0}}@keyframes gtest0{0%,0.00%{opacity:0}0.00%,13.33%{opacity:1}13.42%,100%{opacity:0}}@keyframes gtest1{0%,69.92%{opacity:0}70.00%,93.33%{opacity:1}93.42%,100%{opacity:0}}@keyframes gengine0{0%,56.58%{opacity:0}56.67%,70.00%{opacity:1}70.08%,100%{opacity:0}}@keyframes b1{0%,0.00%{r:9}1.67%{r:12}4.17%,13.33%{r:10}15.00%,100%{r:9}}@keyframes b2{0%,13.33%{r:9}15.00%{r:12}17.50%,30.00%{r:10}31.67%,100%{r:9}}@keyframes b3{0%,30.00%{r:9}31.67%{r:12}34.17%,43.33%{r:10}45.00%,100%{r:9}}@keyframes b4{0%,43.33%{r:9}45.00%{r:12}47.50%,56.67%{r:10}58.33%,100%{r:9}}@keyframes b5{0%,56.67%{r:9}58.33%{r:12}60.83%,70.00%{r:10}71.67%,100%{r:9}}@keyframes b6{0%,70.00%{r:9}71.67%{r:12}74.17%,93.33%{r:10}95.00%,100%{r:9}}@keyframes chipset{0%,31.67%{opacity:0}35.00%,96.67%{opacity:1}99.17%,100%{opacity:0}}@keyframes chipverdict{0%,74.17%{opacity:0}77.50%,96.67%{opacity:1}99.17%,100%{opacity:0}}@keyframes c0{0%,0.00%{opacity:0}0.00%,13.33%{opacity:1}13.42%,100%{opacity:0}}@keyframes c1{0%,13.25%{opacity:0}13.33%,30.00%{opacity:1}30.08%,100%{opacity:0}}@keyframes c2{0%,29.92%{opacity:0}30.00%,43.33%{opacity:1}43.42%,100%{opacity:0}}@keyframes c3{0%,43.25%{opacity:0}43.33%,56.67%{opacity:1}56.75%,100%{opacity:0}}@keyframes c4{0%,56.58%{opacity:0}56.67%,70.00%{opacity:1}70.08%,100%{opacity:0}}@keyframes c5{0%,69.92%{opacity:0}70.00%,97.50%{opacity:1}97.58%,100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.comet,.glow,.cap,.badge circle{animation-duration:12.0s;animation-timing-function:linear;animation-iteration-count:infinite}.flow{animation:march 1s linear infinite}.chip-set{animation:chipset 12.0s linear infinite}.chip-verdict{animation:chipverdict 12.0s linear infinite}.static-cap{opacity:0}}</style><rect width="380" height="560" rx="12" fill="#FFFFFF"/><path class="edge" d="M174,49 L206,49"/><polygon points="206,49 200,45 200,53" fill="#AFB8C1"/><path class="edge" d="M286,78 L286,130"/><polygon points="286,130 282,124 290,124" fill="#AFB8C1"/><path class="edge" d="M206,159 L174,159"/><polygon points="174,159 180,163 180,155" fill="#AFB8C1"/><polygon points="206,159 200,155 200,163" fill="#AFB8C1"/><path class="edge" d="M286,188 L286,240"/><polygon points="286,240 282,234 290,234" fill="#AFB8C1"/><path class="edge" d="M286,298 L286,350"/><polygon points="286,350 282,344 290,344" fill="#AFB8C1"/><path class="edge" d="M206,379 L174,379"/><polygon points="174,379 180,383 180,375" fill="#AFB8C1"/><path class="edge dash flow" d="M366,49 L374,49 L374,379 L366,379"/><path class="comet" d="M174,49 L206,49" stroke="#0969DA" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 72" style="animation-name:k10"/><path class="comet" d="M286,78 L286,130" stroke="#0969DA" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 92" style="animation-name:k11"/><path class="comet" d="M206,159 L174,159" stroke="#0969DA" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 72" style="animation-name:k12"/><path class="comet" d="M174,159 L206,159" stroke="#9A6700" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 72" style="animation-name:k20"/><path class="comet" d="M286,188 L286,240" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 92" style="animation-name:k30"/><path class="comet" d="M286,298 L286,350" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 92" style="animation-name:k40"/><path class="comet" d="M206,379 L174,379" stroke="#8250DF" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="14 72" style="animation-name:k50"/><rect x="14" y="20" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="20" width="4" height="58" rx="2" fill="#0969DA"/><text class="t" x="30" y="46" font-size="13" font-weight="600">AI model</text><text class="t mu" x="30" y="64" font-size="11">any provider</text><rect class="glow" x="11" y="17" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gmodel0"/><rect x="206" y="20" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="206" y="20" width="4" height="58" rx="2" fill="#0969DA"/><text class="t" x="222" y="46" font-size="13" font-weight="600">Browser Use agent</text><text class="t mu" x="222" y="64" font-size="11">logs in, clicks, types</text><rect class="glow" x="203" y="17" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gagent0"/><rect x="14" y="130" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="130" width="4" height="58" rx="2" fill="#1A7F37"/><text class="t" x="30" y="156" font-size="13" font-weight="600">Your app</text><text class="t mu" x="30" y="174" font-size="11">authorized test target</text><rect class="glow" x="11" y="127" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gapp0"/><rect x="206" y="130" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="206" y="130" width="4" height="58" rx="2" fill="#59636E"/><text class="t" x="222" y="156" font-size="13" font-weight="600">Chromium</text><text class="t mu" x="222" y="174" font-size="11">one browser session</text><rect class="glow" x="203" y="127" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gchromium0"/><rect x="206" y="240" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="206" y="240" width="4" height="58" rx="2" fill="#8250DF"/><text class="t" x="222" y="266" font-size="13" font-weight="600">CookieGuard observer</text><text class="t mu" x="222" y="284" font-size="11">its own CDP connection</text><rect class="glow" x="203" y="237" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gobserver0"/><rect x="14" y="350" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="350" width="4" height="58" rx="2" fill="#8250DF"/><text class="t" x="30" y="376" font-size="13" font-weight="600">Your test code</text><text class="t mu" x="30" y="394" font-size="11">start → run → finish</text><rect class="glow" x="11" y="347" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gtest0"/><rect class="glow" x="11" y="347" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gtest1"/><rect x="206" y="350" width="160" height="58" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="206" y="350" width="4" height="58" rx="2" fill="#8250DF"/><text class="t" x="222" y="376" font-size="13" font-weight="600">CookieGuard engine</text><text class="t mu" x="222" y="394" font-size="11">local · CG001–CG009</text><rect class="glow" x="203" y="347" width="166" height="64" rx="12" fill="none" stroke="#8250DF" stroke-width="2.5" style="animation-name:gengine0"/><rect x="14" y="240" width="160" height="58" rx="10" fill="none" stroke="#D0D7DE" stroke-dasharray="4 3"/><text class="t mu" x="26" y="258" font-size="11">Cookie values: local</text><text class="t mu" x="26" y="273" font-size="11">engine only. Never the</text><text class="t mu" x="26" y="288" font-size="11">model, logs, or reports.</text><g class="badge"><circle cx="14" cy="350" r="9" fill="#8250DF" style="animation-name:b1"/><text x="14" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1</text></g><g class="badge"><circle cx="190" cy="33" r="9" fill="#8250DF" style="animation-name:b2"/><text x="190" y="37" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">2</text></g><g class="badge"><circle cx="190" cy="143" r="9" fill="#8250DF" style="animation-name:b3"/><text x="190" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">3</text></g><g class="badge"><circle cx="302" cy="214" r="9" fill="#8250DF" style="animation-name:b4"/><text x="302" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4</text></g><g class="badge"><circle cx="302" cy="324" r="9" fill="#8250DF" style="animation-name:b5"/><text x="302" y="328" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">5</text></g><g class="badge"><circle cx="190" cy="363" r="9" fill="#8250DF" style="animation-name:b6"/><text x="190" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">6</text></g><g class="chip-set"><rect x="14" y="194" width="191" height="38" rx="6" fill="#FFF8C5" stroke="#9A6700"/><text class="t m" x="23" y="210" font-size="11" style="fill:#9A6700">Set-Cookie: session_id=…</text><text class="t m" x="23" y="225" font-size="11" style="fill:#9A6700">Secure; SameSite=Lax</text></g><g class="chip-verdict"><rect x="14" y="422" width="301" height="24" rx="6" fill="#FFEBE9" stroke="#CF222E"/><text class="t" x="24" y="438" font-size="12" font-weight="700" style="fill:#CF222E">FAIL · CG001 Missing HttpOnly · exit 1</text></g><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c0"><tspan x="190.0" dy="0">1. Your test starts CookieGuard, then the</tspan><tspan x="190.0" dy="17">Browser Use agent.</tspan></text><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c1"><tspan x="190.0" dy="0">2. The agent logs in. Its model sees the</tspan><tspan x="190.0" dy="17">page, never cookie values.</tspan></text><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c2"><tspan x="190.0" dy="0">3. The app responds with Set-Cookie:</tspan><tspan x="190.0" dy="17">session_id (here: no HttpOnly).</tspan></text><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c3"><tspan x="190.0" dy="0">4. CookieGuard reads the same browser over</tspan><tspan x="190.0" dy="17">its own CDP connection.</tspan></text><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c4"><tspan x="190.0" dy="0">5. The local engine applies the policy.</tspan><tspan x="190.0" dy="17">Cookie values stay on your machine.</tspan></text><text class="t cap" x="190.0" y="486" text-anchor="middle" font-size="13" style="animation-name:c5"><tspan x="190.0" dy="0">6. Your test enforces the result. The agent</tspan><tspan x="190.0" dy="17">cannot override it.</tspan></text><text class="t mu static-cap" x="190.0" y="486" text-anchor="middle" font-size="12"><tspan x="190.0" dy="0">Test starts CookieGuard → agent logs in →</tspan><tspan x="190.0" dy="16">app sets the cookie → CookieGuard observes →</tspan><tspan x="190.0" dy="16">local engine decides → test enforces.</tspan></text></svg>

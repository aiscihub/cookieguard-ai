<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1129" width="380" height="1129" role="img" aria-labelledby="title desc"><title id="title">CookieGuard policy</title><desc id="desc">CookieGuard policy: CookieGuardAudit options decide which findings fail. High-severity rules CG001, CG002, CG006 and CG007 fail by default; medium rules CG003 and CG005 fail when fail_on is medium; CG004 needs require_host_only; CG008 and CG009 are review only. Results: FAIL, INCOMPLETE, or PASS.</desc><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1F2328}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.mu{fill:#59636E}.b,.cap{opacity:0}@keyframes showA{0%,48%{opacity:1}52%,98%{opacity:0}100%{opacity:1}}@keyframes showB{0%,48%{opacity:0}52%,98%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:no-preference){.a{animation:showA 10.0s linear infinite}.b{animation:showB 10.0s linear infinite}.ca{animation:showA 10.0s linear infinite}.cb{animation:showB 10.0s linear infinite}.static{opacity:0}}</style><rect width="380" height="1129" rx="12" fill="#FFFFFF"/><text class="t" x="16" y="30" font-size="15" font-weight="600">Your policy decides which findings fail the run</text><rect x="14" y="50" width="352" height="231" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="50" width="4" height="231" rx="2" fill="#8250DF"/><text class="t" x="30" y="74" font-size="13" font-weight="600">1 · Your policy</text><text class="t m" x="30" y="100" font-size="11">CookieGuardAudit(</text><text class="t m" x="43" y="119" font-size="11">auth_cookies=[&#x27;session_id&#x27;],</text><text class="t m" x="43" y="138" font-size="11">fail_on=</text><text class="t m a" x="96" y="138" font-size="11" font-weight="700" style="fill:#CF222E">&#x27;high&#x27;,</text><text class="t m b" x="96" y="138" font-size="11" font-weight="700" style="fill:#CF222E">&#x27;medium&#x27;,</text><text class="t m" x="43" y="157" font-size="11">allowed_same_site=(&#x27;lax&#x27;,&#x27;strict&#x27;),</text><text class="t m" x="43" y="176" font-size="11">require_host_only=False,</text><text class="t m" x="43" y="195" font-size="11">max_lifetime_days=30,</text><text class="t m" x="30" y="214" font-size="11">)</text><text class="t mu" x="30" y="241" font-size="11">Only cookies named in auth_cookies can be confirmed.</text><text class="t mu" x="30" y="256" font-size="11">Others are review items (CG008).</text><text class="t" x="14" y="325" font-size="13" font-weight="600">2 · Rules by severity</text><text class="t mu" x="14" y="351" font-size="10" letter-spacing="0.6">HIGH</text><rect x="14" y="359" width="352" height="26" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="359" width="352" height="26" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="376" font-size="11" font-weight="700">CG001</text><text class="t" x="70" y="376" font-size="12">Missing HttpOnly</text><text class="t" x="356" y="376" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="14" y="391" width="352" height="26" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="391" width="352" height="26" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="408" font-size="11" font-weight="700">CG002</text><text class="t" x="70" y="408" font-size="12">Missing Secure</text><text class="t" x="356" y="408" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="14" y="423" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="423" width="352" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="440" font-size="11" font-weight="700">CG006</text><text class="t" x="70" y="440" font-size="12">Invalid cookie prefix</text><text class="t mu m" x="70" y="455" font-size="10">__Host- / __Secure-</text><text class="t" x="356" y="440" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="14" y="469" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect x="14" y="469" width="352" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="486" font-size="11" font-weight="700">CG007</text><text class="t" x="70" y="486" font-size="12">Protection regressed</text><text class="t mu m" x="70" y="501" font-size="10">finish(baseline=…)</text><text class="t" x="356" y="486" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><text class="t mu" x="14" y="547" font-size="10" letter-spacing="0.6">MEDIUM</text><rect x="14" y="555" width="352" height="54" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect class="b" x="14" y="555" width="352" height="54" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="572" font-size="11" font-weight="700">CG003</text><text class="t" x="70" y="572" font-size="12">SameSite outside policy</text><text class="t mu m" x="70" y="587" font-size="10">allowed_same_site</text><text class="t mu m" x="70" y="600" font-size="10">require_explicit_same_site</text><text class="t mu a" x="356" y="572" text-anchor="end" font-size="10">reported</text><text class="t b" x="356" y="572" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><rect x="14" y="615" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="24" y="632" font-size="11" font-weight="700">CG004</text><text class="t" x="70" y="632" font-size="12">Domain sharing</text><text class="t mu m" x="70" y="647" font-size="10">review unless require_host_only=True</text><text class="t mu" x="356" y="632" text-anchor="end" font-size="10">reported</text><rect x="14" y="661" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><rect class="b" x="14" y="661" width="352" height="40" rx="7" fill="#FFEBE9" stroke="#CF222E"/><text class="t m" x="24" y="678" font-size="11" font-weight="700">CG005</text><text class="t" x="70" y="678" font-size="12">Lifetime over the limit</text><text class="t mu m" x="70" y="693" font-size="10">max_lifetime_days</text><text class="t mu a" x="356" y="678" text-anchor="end" font-size="10">reported</text><text class="t b" x="356" y="678" text-anchor="end" font-size="10" font-weight="700" style="fill:#CF222E">FAILS</text><text class="t mu" x="14" y="739" font-size="10" letter-spacing="0.6">REVIEW ONLY · NEVER FAILS</text><rect x="14" y="747" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="24" y="764" font-size="11" font-weight="700">CG008</text><text class="t" x="70" y="764" font-size="12">Role not confirmed</text><text class="t mu m" x="70" y="779" font-size="10">cookie not in auth_cookies</text><text class="t mu" x="356" y="764" text-anchor="end" font-size="10">reported</text><rect x="14" y="793" width="352" height="40" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/><text class="t m" x="24" y="810" font-size="11" font-weight="700">CG009</text><text class="t" x="70" y="810" font-size="12">Evidence needs review</text><text class="t mu m" x="70" y="825" font-size="10">e.g. SameSite declaration unknown</text><text class="t mu" x="356" y="810" text-anchor="end" font-size="10">reported</text><g class="a"><line x1="8" y1="521" x2="372" y2="521" stroke="#CF222E" stroke-width="2" stroke-dasharray="6 4"/><rect x="238" y="512" width="122" height="18" rx="9" fill="#FFFFFF" stroke="#CF222E"/><text class="t m" x="299" y="525" text-anchor="middle" font-size="10" font-weight="700" style="fill:#CF222E">fail_on='high' ▲</text></g><g class="b"><line x1="8" y1="713" x2="372" y2="713" stroke="#CF222E" stroke-width="2" stroke-dasharray="6 4"/><rect x="238" y="704" width="122" height="18" rx="9" fill="#FFFFFF" stroke="#CF222E"/><text class="t m" x="299" y="717" text-anchor="middle" font-size="10" font-weight="700" style="fill:#CF222E">fail_on='medium' ▲</text></g><text class="t" x="14" y="891" font-size="13" font-weight="600">3 · Result</text><rect x="14" y="907" width="352" height="42" rx="8" fill="#F6F8FA" stroke="#CF222E"/><text class="t" x="24" y="925" font-size="11" font-weight="700" style="fill:#CF222E">FAIL · exit 1</text><text class="t mu" x="24" y="941" font-size="10.5">A confirmed finding at or above fail_on.</text><rect x="14" y="957" width="352" height="56" rx="8" fill="#F6F8FA" stroke="#9A6700"/><text class="t" x="24" y="975" font-size="11" font-weight="700" style="fill:#9A6700">INCOMPLETE · exit 2</text><text class="t mu" x="24" y="991" font-size="10.5">An expected cookie is missing, or evidence is</text><text class="t mu" x="24" y="1005" font-size="10.5">unreliable. Overrides FAIL.</text><rect x="14" y="1021" width="352" height="42" rx="8" fill="#F6F8FA" stroke="#1A7F37"/><text class="t" x="24" y="1039" font-size="11" font-weight="700" style="fill:#1A7F37">PASS · exit 0</text><text class="t mu" x="24" y="1055" font-size="10.5">Otherwise. Review items may remain.</text><text class="t cap ca" x="190.0" y="1089" text-anchor="middle" font-size="12.5"><tspan x="190.0" dy="0">fail_on=&#x27;high&#x27; (default): only high-severity findings</tspan><tspan x="190.0" dy="16">fail the run.</tspan></text><text class="t cap cb" x="190.0" y="1089" text-anchor="middle" font-size="12.5"><tspan x="190.0" dy="0">fail_on=&#x27;medium&#x27;: SameSite and lifetime findings fail</tspan><tspan x="190.0" dy="16">too.</tspan></text><text class="t mu static" x="190.0" y="1089" text-anchor="middle" font-size="12"><tspan x="190.0" dy="0">With fail_on=&#x27;medium&#x27;, CG003 and CG005 fail too. CG004</tspan><tspan x="190.0" dy="16">fails only with require_host_only=True.</tspan></text></svg>

name: Weekly cookie dataset and candidate refresh
on:
  schedule:
    # Mondays at 02:17 UTC; avoid the busy top of the hour.
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      evaluate_run:
        description: 'Evaluate saved artifacts only; no sampling or website visits'
        type: string
        default: ''
      resume_run:
        description: 'Resume a stopped real run; visit only sites not previously attempted'
        type: string
        default: ''
      visited_prefix:
        description: 'Legacy log overrides, e.g. 2=36 (space-separated shard=count pairs)'
        type: string
        default: ''
      sites:
        description: 'Sites to sample (1–10000)'
        type: number
        default: 10000
      shards:
        description: 'Shards (1–16, at most the site count)'
        type: number
        default: 16
      dry_run:
        description: 'Evaluate only; no dataset or model PR'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  # Keep the concurrency key shared with the historical monthly workflow.
  group: monthly-refresh
  cancel-in-progress: false
env:
  COOKIEGUARD_USAGE_METRICS: '0'
  DO_NOT_TRACK: '1'
  ORT_DISABLE_TELEMETRY: '1'
  ANONYMIZED_TELEMETRY: 'false'
  BROWSER_USE_CLOUD_SYNC: 'false'
  BROWSER_USE_DISABLE_EXTENSIONS: '1'
jobs:
  frame:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.resume_run == '' && inputs.evaluate_run == ''
    # Pinned: ubuntu-latest is moving to 26.04, where Playwright system dependencies can fail to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.frame.outputs.matrix }}
      month: ${{ steps.frame.outputs.month }}
      shards: ${{ steps.frame.outputs.shards }}
      dry_run: ${{ steps.frame.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Approved asset, exclusions, frozen frame, and durable reservation
        id: frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: python refresh/ci.py prepare
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frame
          path: refresh/.work/run/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  resume:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.resume_run != '' && inputs.evaluate_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.resume.outputs.matrix }}
      shards: ${{ steps.resume.outputs.shards }}
      has_work: ${{ steps.resume.outputs.has_work }}
      month: ${{ steps.resume.outputs.month }}
      dry_run: ${{ steps.resume.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frame
          path: refresh/.work/source/frame
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: shard-*
          path: refresh/.work/source
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Verify the real reservation, compute prefixes, and reserve one resume
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: python refresh/ci.py resume
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frame
          path: refresh/.work/run/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  crawl:
    needs: frame
    if: github.run_attempt == 1
    # Pinned: ubuntu-latest is moving to 26.04, where Playwright system dependencies can fail to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.frame.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install root dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install refresh dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --prefix refresh --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install Chromium and its system dependencies (retried; no site is visited here)
        run: for attempt in 1 2 3; do npx --no-install playwright install --with-deps chromium && exit 0; sleep 15; done; exit 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frame
          path: refresh/.work/run
      - name: Crawl one reserved shard once
        id: crawl
        env:
          REFRESH_SHARD: ${{ matrix.shard }}
          REFRESH_SHARDS: ${{ needs.frame.outputs.shards }}
        run: node refresh/crawl.mjs --shard "$REFRESH_SHARD" --of "$REFRESH_SHARDS"
      - name: Preserve the ledger and only the last verified data after interruption
        if: always()
        env:
          REFRESH_SHARD: ${{ matrix.shard }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: node refresh/seal.mjs --source "refresh/.work/run/shards/shard-$REFRESH_SHARD" --out "refresh/.work/artifacts/shard-$REFRESH_SHARD" --shard "$REFRESH_SHARD" --outcome "$CRAWL_OUTCOME"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && hashFiles('refresh/.work/artifacts/shard-*/started.json') != ''
        with:
          name: shard-${{ matrix.shard }}
          path: refresh/.work/artifacts/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  resume_crawl:
    needs: resume
    if: github.run_attempt == 1 && needs.resume.outputs.has_work == 'true'
    # Pinned: ubuntu-latest is moving to 26.04, where Playwright system dependencies can fail to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.resume.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install root dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install refresh dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --prefix refresh --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install Chromium and its system dependencies (retried; no site is visited here)
        run: for attempt in 1 2 3; do npx --no-install playwright install --with-deps chromium && exit 0; sleep 15; done; exit 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frame
          path: refresh/.work/run
      - name: Crawl only the never-visited suffix of a resumed shard
        id: crawl
        env:
          REFRESH_SHARD: ${{ matrix.shard }}
          REFRESH_SHARDS: ${{ needs.resume.outputs.shards }}
        run: node refresh/crawl.mjs --shard "$REFRESH_SHARD" --of "$REFRESH_SHARDS" --resume-input "refresh/.work/run/resume-inputs/shard-$REFRESH_SHARD"
      - name: Preserve the ledger and only the last verified data after interruption
        if: always()
        env:
          REFRESH_SHARD: ${{ matrix.shard }}
          CRAWL_OUTCOME: ${{ steps.crawl.outcome }}
        run: node refresh/seal.mjs --source "refresh/.work/run/shards/shard-$REFRESH_SHARD" --out "refresh/.work/artifacts/shard-$REFRESH_SHARD" --shard "$REFRESH_SHARD" --outcome "$CRAWL_OUTCOME"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && hashFiles('refresh/.work/artifacts/shard-*/started.json') != ''
        with:
          name: shard-${{ matrix.shard }}
          path: refresh/.work/artifacts/shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  evaluate:
    needs: [frame, crawl, resume, resume_crawl]
    if: always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (needs.frame.result == 'success' || needs.resume.result == 'success' || (inputs.evaluate_run != '' && inputs.resume_run == ''))
    permissions:
      contents: read
      actions: read
    # Pinned: ubuntu-latest is moving to 26.04, where Playwright system dependencies can fail to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REFRESH_MONTH: ${{ needs.resume.outputs.month || needs.frame.outputs.month }}
    outputs:
      dry_run: ${{ steps.recover.outputs.dry_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install root dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install refresh dependencies (up to three attempts)
        run: for attempt in 1 2 3; do npm ci --prefix refresh --no-audit --no-fund && exit 0; sleep 15; done; exit 1
      - name: Install Chromium and its system dependencies (retried; no site is visited here)
        run: for attempt in 1 2 3; do npx --no-install playwright install --with-deps chromium && exit 0; sleep 15; done; exit 1
      - run: node integrations/python/scripts/vendor_engine.mjs
      - run: python -m pip install -r refresh/requirements.lock -r refresh/requirements-browser.txt -e './integrations/python[test]'
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python refresh/fetch_training.py
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.evaluate_run == ''
        with:
          name: frame
          path: refresh/.work/run
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.evaluate_run == ''
        with:
          pattern: shard-*
          path: refresh/.work/run/shards
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.evaluate_run != ''
        with:
          name: frame
          path: refresh/.work/source/frame
          run-id: ${{ inputs.evaluate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.evaluate_run != ''
        with:
          pattern: shard-*
          path: refresh/.work/source
          run-id: ${{ inputs.evaluate_run }}
          github-token: ${{ github.token }}
      - name: Verify and stage saved artifacts for evaluation only
        id: recover
        if: inputs.evaluate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python refresh/ci.py recover
      - run: node --test refresh/tests/core.test.mjs refresh/tests/periods.test.mjs refresh/tests/network.test.mjs refresh/tests/shards.test.mjs
      - run: node --test refresh/tests/browser.test.mjs
      - run: python -m unittest discover -s refresh/tests -v
      - run: python refresh/merge.py
      - run: python refresh/evaluate.py --month "$REFRESH_MONTH" --phase baseline
      - run: python refresh/train.py --month "$REFRESH_MONTH"
      - run: python refresh/evaluate.py --month "$REFRESH_MONTH" --phase candidate
      - run: python refresh/canaries.py
      - run: python refresh/gate.py --release "data/releases/$REFRESH_MONTH"
      - name: Install ripgrep for the privacy audit
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Scan every deliverable before upload
        run: python refresh/privacy_audit.py --release "data/releases/$REFRESH_MONTH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evaluated-refresh
          path: |
            refresh/.work/run/
            refresh/state/crawled_domains.txt
            data/releases/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: [frame, resume, evaluate]
    if: always() && needs.evaluate.result == 'success' && github.run_attempt == 1 && (needs.frame.outputs.dry_run == 'false' || needs.resume.outputs.dry_run == 'false' || needs.evaluate.outputs.dry_run == 'false')
    # Pinned: ubuntu-latest is moving to 26.04, where Playwright system dependencies can fail to install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: evaluated-refresh
          path: .
      # The training asset is audited by hash too, so restore it before the final verification.
      - run: python refresh/fetch_training.py
      - name: First-run drafts; later dataset auto-merge; every model requires a person
        env:
          GH_TOKEN: ${{ github.token }}
        run: python refresh/ci.py publish

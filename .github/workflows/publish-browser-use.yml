name: Publish CookieGuard for Browser Use

on:
  push:
    tags: ['browser-use-v*']
  workflow_dispatch:
    inputs:
      target:
        description: Package index approved by the maintainer for this upload
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CLOUD_SYNC: 'false'
      BROWSER_USE_DISABLE_EXTENSIONS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Vendor the published engine without changing it
        run: node integrations/browser-use/scripts/vendor_engine.mjs --registry
      - name: Install packaging tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build and check package descriptions
        working-directory: integrations/browser-use
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/verify_metadata.py
      - name: Allow Chromium's sandbox on Ubuntu
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify the wheel from a clean external consumer
        working-directory: integrations/browser-use
        run: python scripts/verify_external.py
      # verify_external.py rebuilds dist/. Check the files that will be uploaded.
      - name: Check the verified distributions
        working-directory: integrations/browser-use
        run: |
          python -m twine check --strict dist/*
          python scripts/verify_metadata.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cookieguard-browser-use-dist
          path: integrations/browser-use/dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cookieguard-browser-use
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: cookieguard-browser-use-dist
          path: dist/
      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/browser-use-v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cookieguard-browser-use
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: cookieguard-browser-use-dist
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

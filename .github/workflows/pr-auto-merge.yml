name: Merge labeled PRs after CI

on:
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number (the auto-merge label is still required)
        required: true
        type: string
      dry_run:
        description: Report eligibility without changing the pull request
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Manage the auto-merge label
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge') ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out a PR head with a write token. No PR code, packages,
      # artifacts, caches, or third-party AI services are used in this job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reconcile label with native GitHub auto-merge
        run: node scripts/pr-auto-merge.mjs
        env:
          GH_TOKEN: ${{ github.token }}

name: CookieGuard CI public beta release gate
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolkit:
    name: Linux / Node 24 / Chromium / packaged consumers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Tests, external tarballs, dependencies, licenses, and secret leakage
        id: release
        run: npm run release:check
      - name: Start local fixture
        run: |
          node examples/demo/server.js > "$RUNNER_TEMP/cookieguard-demo.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Passing audit through the local composite action
        id: secure
        uses: ./action
        with:
          target: http://127.0.0.1:3000/secure
          auth-cookies: session_id
          artifact-name: cookieguard-secure
      - name: Deliberate failure through the local composite action
        id: insecure
        continue-on-error: true
        uses: ./action
        with:
          target: http://127.0.0.1:3000/missing-httponly
          auth-cookies: session_id
          artifact-name: cookieguard-insecure
      - name: Expected authentication cookie is absent
        id: missing
        continue-on-error: true
        uses: ./action
        with:
          target: http://127.0.0.1:3000/preference
          auth-cookies: session_id
          artifact-name: cookieguard-missing-auth
      - name: Verify all three Action outcomes
        env:
          CG_SECURE_CODE: ${{ steps.secure.outputs.exit-code }}
          CG_OUTCOME: ${{ steps.insecure.outcome }}
          CG_EXIT_CODE: ${{ steps.insecure.outputs.exit-code }}
          CG_MISSING_OUTCOME: ${{ steps.missing.outcome }}
          CG_MISSING_CODE: ${{ steps.missing.outputs.exit-code }}
        run: |
          test "$CG_SECURE_CODE" = 0
          test "$CG_OUTCOME" = failure
          test "$CG_EXIT_CODE" = 1
          test "$CG_MISSING_OUTCOME" = failure
          test "$CG_MISSING_CODE" = 2
      - name: Check hosted reports and fixture logs for sentinel leakage
        id: outputs
        if: ${{ always() && steps.secure.outputs.report-path != '' && steps.insecure.outputs.report-path != '' && steps.missing.outputs.report-path != '' }}
        env:
          CG_SECURE_REPORT: ${{ steps.secure.outputs.report-path }}
          CG_INSECURE_REPORT: ${{ steps.insecure.outputs.report-path }}
          CG_MISSING_REPORT: ${{ steps.missing.outputs.report-path }}
        run: node scripts/check-artifacts.js "$CG_SECURE_REPORT" "$CG_INSECURE_REPORT" "$CG_MISSING_REPORT" "$RUNNER_TEMP/cookieguard-demo.log"
      - name: Upload reviewed release evidence and local tarballs
        if: ${{ success() && steps.release.outcome == 'success' && steps.outputs.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cookieguard-public-beta-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  browser-use:
    name: Linux / Python ${{ matrix.python }} / Browser Use / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every supported version, even if one fails.
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CLOUD_SYNC: 'false'
      BROWSER_USE_DISABLE_EXTENSIONS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Vendor the published CookieGuard engine into the Python package
        run: node integrations/browser-use/scripts/vendor_engine.mjs --published
      - name: Install the Browser Use integration
        working-directory: integrations/browser-use
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip build
          .venv/bin/python -m pip install -e ".[test]"
      - name: Engine, policy, and attribution tests (no browser)
        working-directory: integrations/browser-use
        timeout-minutes: 5
        run: .venv/bin/python -m pytest -v -p no:cacheprovider tests/test_config.py tests/test_engine.py tests/test_collector.py
      - name: Allow Chromium's sandbox on Ubuntu 24.04
        # Ubuntu 23.10+ restricts unprivileged user namespaces with AppArmor. Playwright's
        # Chromium, which Browser Use prefers, needs them for its sandbox; keep the sandbox on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Browser smoke diagnostics
        working-directory: integrations/browser-use
        timeout-minutes: 4
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          ls -l /usr/bin/google-chrome-stable || true
          /usr/bin/google-chrome-stable --version || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          timeout 180 .venv/bin/python -u scripts/browser_smoke.py
      - name: Real-browser and agent tests
        working-directory: integrations/browser-use
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: '1'
        # faulthandler dumps every thread's stack if one test runs longer than 90s.
        run: .venv/bin/python -m pytest -v -p no:cacheprovider -o faulthandler_timeout=90 --maxfail=3 tests/test_browser.py tests/test_agent.py
      - name: Browser Use evidence through the MCP server (Python MCP SDK client)
        working-directory: integrations/browser-use
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: '1'
        run: .venv/bin/python scripts/agent_discovery_e2e.py
      - name: Verify the wheel from a clean external consumer
        working-directory: integrations/browser-use
        run: .venv/bin/python scripts/verify_external.py
      - name: Check Browser Use evidence for synthetic-secret leakage
        run: node scripts/check-artifacts.js artifacts/browser-use
      - name: Check the cookieguard alias package
        working-directory: integrations/pypi-cookieguard
        run: |
          ../browser-use/.venv/bin/python -m pip install --no-deps .
          ../browser-use/.venv/bin/python -I -c "import cookieguard, cookieguard_browser_use as real; assert cookieguard.CookieGuardAudit is real.CookieGuardAudit"
